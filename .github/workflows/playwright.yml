name: Playwright Responsive Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0

      - name: Install Playwright browsers
        uses: microsoft/playwright-github-actions@v1
        with:
          browsers: chromium, webkit

      - name: Install system dependencies (Ubuntu)
        run: |
          npx playwright install-deps --with-deps chromium webkit

      - name: Run responsive tests (Chromium)
        run: npm run test:e2e
        env:
          PLAYWRIGHT_CHROMIUM_DISABLE_SECCOMP: 1
          CI: true

      - name: Run responsive tests (WebKit)
        run: npx playwright test --project=webkit
        if: ${{ !cancelled() }}
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project || 'all' }}
          path: playwright-report/
          retention-days: 7
